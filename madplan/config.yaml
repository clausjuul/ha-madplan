name: "Madplan"
version: "0.31.0"
slug: "madplan"
description: "Familiens madplan, indkøbsliste og ugeplanlægger"
url: "https://github.com/clausjuul/ha-madplan"
image: "ghcr.io/clausjuul/ha-madplan-{arch}"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
homeassistant_api: true
# Announces the internal API (port 8100, Supervisor network only) to the bundled integration.
discovery:
  - madplan
# www/madplan in the HA config folder receives the dashboard cards and dish photos.
map:
  - type: homeassistant_config
    read_only: false
panel_icon: "mdi:silverware-fork-knife"
panel_title: "Madplan"
stage: experimental
options:
  openai_api_key: ""
  prej_api_key: ""
  voice_commands: true
  ha_integration: true
schema:
  openai_api_key: "password?"
  prej_api_key: "password?"
  voice_commands: bool
  ha_integration: bool
