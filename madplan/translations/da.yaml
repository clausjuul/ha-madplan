configuration:
  openai_api_key:
    name: OpenAI API-nøgle
    description: >-
      Valgfri. Slår AI til (Assist-samtale, AI-forslag i Planlæg og nye opskrifter i Opdag). Brug af OpenAI koster penge og afregnes direkte med OpenAI.
  prej_api_key:
    name: Prej API-nøgle
    description: >-
      Valgfri. Reserveret til tilbud fra Netto og REMA 1000 (vises endnu ikke i version 0.1.0).
  voice_commands:
    name: Stemmekommandoer
    description: >-
      Opretter automationer, så Home Assistants Assist kan svare på "Hvad skal vi have i aften/i morgen?" og "Hvad mangler vi at købe?". Slå fra for at fjerne dem igen.
