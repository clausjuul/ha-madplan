configuration:
  openai_api_key:
    name: OpenAI API key
    description: >-
      Optional. Enables AI (Assist chat, AI suggestions in Planlæg and new recipes in Opdag). OpenAI usage costs money and is billed directly by OpenAI.
  prej_api_key:
    name: Prej API key
    description: >-
      Optional. Fetches this week's offers from Netto and REMA 1000 once each morning (at most 20 calls a day, so the free key is enough). Get a key at prej.dk/api.
  voice_commands:
    name: Voice commands
    description: >-
      Creates automations so Home Assistant's Assist can answer "Hvad skal vi have i aften/i morgen?" and "Hvad mangler vi at købe?". Turn off to remove them again.
