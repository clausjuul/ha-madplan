# Paths assume madplan-app is the repository root.
name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (fake API, incl. accessibility)
        run: npx playwright test
        working-directory: web
      - name: Playwright integration (real server)
        run: npm run e2e:integration -w web
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the add-on version
        run: |
          version="$(grep -E '^version:' madplan/config.yaml | cut -d'"' -f2)"
          test "$GITHUB_REF_NAME" = "v${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_VERSION=${{ env.VERSION }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ha-madplan-${{ matrix.arch }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/ha-madplan-${{ matrix.arch }}:latest
