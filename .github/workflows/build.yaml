# Paths assume madplan-app is the repository root.
name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (fake API, incl. accessibility)
        run: npx playwright test
        working-directory: web
      - name: Playwright integration (real server)
        run: npm run e2e:integration -w web
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
  # Every push to main that passes verify becomes a release: bump the add-on version,
  # add a changelog entry from the commit subjects, commit, tag and publish images.
  # Pushes made with GITHUB_TOKEN do not start new workflow runs, so this cannot loop.
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version and write changelog
        id: bump
        run: |
          git pull --ff-only origin main
          current="$(grep -E '^version:' madplan/config.yaml | cut -d'"' -f2)"
          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          range="${last_tag:+${last_tag}..}HEAD"
          subjects="$(git log --no-merges --format='%s' "$range" | grep -v '^chore(release)' || true)"
          if [ -z "$subjects" ]; then
            echo "Nothing new since ${last_tag}."
            exit 0
          fi
          IFS=. read -r major minor patch <<< "$current"
          if echo "$subjects" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
            major=$((major + 1)); minor=0; patch=0
          elif echo "$subjects" | grep -qE '^feat(\(.+\))?:'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          version="${major}.${minor}.${patch}"
          sed -i -E "s/^version: \".*\"/version: \"${version}\"/" madplan/config.yaml
          # Keep every package.json (and the lockfile) on the add-on version; version.test.ts checks this.
          VERSION="${version}" node -e 'const fs=require("fs");for(const f of ["package.json","domain/package.json","server/package.json","web/package.json"]){const j=JSON.parse(fs.readFileSync(f,"utf8"));j.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(j,null,2)+"\n");}'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          {
            echo "# Ændringer"
            echo
            echo "## ${version}"
            echo
            echo "$subjects" | sed 's/^/- /'
            tail -n +2 madplan/CHANGELOG.md
          } > CHANGELOG.tmp && mv CHANGELOG.tmp madplan/CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${version}"
          git tag "v${version}"
          git push origin HEAD:main "v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [verify, release]
    # Runs after an automatic release, or for a tag pushed by hand.
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.release.outputs.version != '' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version != '' && format('v{0}', needs.release.outputs.version) || github.ref }}
      - name: Check the tag matches the add-on version
        env:
          EXPECTED_TAG: ${{ needs.release.outputs.version != '' && format('v{0}', needs.release.outputs.version) || github.ref_name }}
        run: |
          version="$(grep -E '^version:' madplan/config.yaml | cut -d'"' -f2)"
          test "${EXPECTED_TAG}" = "v${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_VERSION=${{ env.VERSION }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ha-madplan-${{ matrix.arch }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/ha-madplan-${{ matrix.arch }}:latest
