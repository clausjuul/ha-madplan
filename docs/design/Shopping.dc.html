<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Madplan – indkøbsliste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0C0E}
a{color:#7CECFF}a:hover{color:#B5F5FF}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0C0E; color: #F4F2EE; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="WeekPhone.dc.html" aria-label="Tilbage til ugen" style="width: 44px; height: 44px; border-radius: 999px; background: #15171B; color: #F4F2EE; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div style="flex: 1">
        <strong style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 26px; font-weight: 700; display: block; line-height: 1.1">Indkøb</strong>
        <span style="font-size: 13px; color: #A7AAB2">Til i dag – søndag 15. nov.</span>
      </div>
      <span style="font-size: 14px; font-weight: 600; color: #7CECFF">{{doneCount}}/{{totalCount}}</span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 14px; background: #15171B">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A7AAB2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tilføj vare</span>
      <input placeholder="Tilføj fx 2 liter mælk" style="flex: 1; border: 0; background: transparent; color: #F4F2EE; font: inherit; font-size: 16px; outline: none">
    </label>
  </header>

  <div style="flex: 1; min-height: 0; overflow: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 18px">
    <sc-for list="{{groups}}" as="group" hint-placeholder-count="4">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0 2px; font-size: 13px; font-weight: 600; color: #A7AAB2; text-transform: uppercase; letter-spacing: 0.05em">{{group.name}}</h2>
        <sc-for list="{{group.items}}" as="item" hint-placeholder-count="3">
          <button type="button" aria-pressed="false" onClick="{{item.toggle}}" style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 8px 14px; border-radius: 16px; border: 0; background: #15171B; color: #F4F2EE; text-align: left">
            <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.28); flex-shrink: 0"></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 17px; font-weight: 500">{{item.name}}</span>
              <span style="font-size: 13px; color: #A7AAB2">{{item.forDish}}</span>
            </span>
            <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
              <span style="font-size: 15px; color: #C9CBD1">{{item.qty}}</span>
              <span style="{{item.priceStyle}}">{{item.price}}</span>
            </span>
          </button>
        </sc-for>
      </section>
    </sc-for>

    <sc-if value="{{hasDone}}" hint-placeholder-val="{{ true }}">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0 2px; font-size: 13px; font-weight: 600; color: #A7AAB2; text-transform: uppercase; letter-spacing: 0.05em">I kurven · {{doneCount}}</h2>
        <sc-for list="{{done}}" as="item" hint-placeholder-count="2">
          <button type="button" aria-pressed="true" onClick="{{item.toggle}}" style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 6px 14px; border-radius: 16px; border: 0; background: transparent; color: #A7AAB2; text-align: left">
            <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 8px; background: #7CECFF; color: #061319; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
            </span>
            <span style="flex: 1; font-size: 16px; text-decoration: line-through">{{item.name}}</span>
            <span style="font-size: 14px">{{item.qty}}</span>
          </button>
        </sc-for>
      </section>
    </sc-if>
    <p style="margin: 0 2px; font-size: 13px; line-height: 1.5; color: #A7AAB2">Salt, peber, olie og det I har i køleskabet er trukket fra.</p>
  </div>

  <footer style="flex-shrink: 0; padding: 14px 16px 18px; border-top: 1px solid rgba(255,255,255,0.07); background: #111317; display: flex; align-items: center; gap: 12px">
    <div style="flex: 1">
      <div style="font-size: 13px; color: #A7AAB2">Forventet pris</div>
      <div style="font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 26px; font-weight: 700">ca. 412 kr.</div>
    </div>
    <span style="font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 999px; background: rgba(255,194,122,0.14); color: #FFC27A">3 tilbud · Netto</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { checked: { lasagne: true, mælk: true } };
  }
  renderVals() {
    var self = this;
    var all = [
      { id: 'spinat-x', group: 'Frugt og grønt', name: 'Løg', qty: '3 stk.', forDish: 'Lasagne · Chili', price: '6 kr.' },
      { id: 'citron', group: 'Frugt og grønt', name: 'Citron', qty: '2 stk.', forDish: 'Laks', price: '8 kr.' },
      { id: 'tomater', group: 'Frugt og grønt', name: 'Cherrytomater', qty: '250 g', forDish: 'Tacos', price: '15 kr.' },
      { id: 'oksekød', group: 'Kød og fisk', name: 'Hakket oksekød', qty: '1 kg', forDish: 'Lasagne · Tacos', price: '79 kr.', offer: true },
      { id: 'laks', group: 'Kød og fisk', name: 'Laksefilet', qty: '450 g', forDish: 'Laks med kartofler', price: '69 kr.' },
      { id: 'mælk', group: 'Køl', name: 'Mælk', qty: '1 l', forDish: 'Lasagne', price: '12 kr.' },
      { id: 'ost', group: 'Køl', name: 'Revet ost', qty: '200 g', forDish: 'Lasagne · Pizza', price: '22 kr.', offer: true },
      { id: 'hakkede', group: 'Kolonial', name: 'Hakkede tomater', qty: '4 dåser', forDish: 'Tomatsuppe · Lasagne', price: '24 kr.', offer: true },
      { id: 'lasagne', group: 'Kolonial', name: 'Lasagneplader', qty: '1 pk.', forDish: 'Lasagne', price: '14 kr.' }
    ];
    var checked = this.state.checked;
    var toggle = function (id) {
      return function () {
        var next = Object.assign({}, self.state.checked);
        if (next[id]) delete next[id]; else next[id] = true;
        self.setState({ checked: next });
      };
    };
    var open = all.filter(function (i) { return !checked[i.id]; });
    var done = all.filter(function (i) { return checked[i.id]; }).map(function (i) { return Object.assign({}, i, { toggle: toggle(i.id) }); });
    var order = ['Frugt og grønt', 'Kød og fisk', 'Køl', 'Kolonial'];
    var groups = order.map(function (g) {
      return {
        name: g,
        items: open.filter(function (i) { return i.group === g; }).map(function (i) {
          return Object.assign({}, i, {
            toggle: toggle(i.id),
            price: i.offer ? 'Tilbud ' + i.price : i.price,
            priceStyle: 'font-size: 13px; ' + (i.offer ? 'color: #FFC27A; font-weight: 600;' : 'color: #A7AAB2;')
          });
        })
      };
    }).filter(function (g) { return g.items.length > 0; });
    return { groups: groups, done: done, hasDone: done.length > 0, doneCount: done.length, totalCount: all.length };
  }
}
</script>
</body>
</html>
