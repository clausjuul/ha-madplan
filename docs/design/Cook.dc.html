<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Madplan – kogetilstand</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0C0E}
a{color:#7CECFF}a:hover{color:#B5F5FF}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #0B0C0E; color: #F4F2EE; font-family: Inter, system-ui, sans-serif; display: grid; grid-template-columns: 380px minmax(0, 1fr); overflow: hidden">

  <aside aria-label="Ingredienser" style="background: #15171B; display: flex; flex-direction: column; min-height: 0">
    <img src="/_blob/53ecfcde428ee5ebea55a342ab106d2f" alt="Lasagne i fad" style="width: 100%; height: 200px; object-fit: cover; display: block">
    <div style="padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; min-height: 0">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 18px; font-weight: 600">Ingredienser</h2>
        <span style="font-size: 14px; color: #A7AAB2">til 3 personer</span>
      </div>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; font-size: 16px">
        <sc-for list="{{ingredients}}" as="ing" hint-placeholder-count="12">
          <li style="display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.06)">
            <span style="width: 78px; flex-shrink: 0; color: #A7AAB2">{{ing.amount}}</span>
            <span>{{ing.name}}</span>
          </li>
        </sc-for>
      </ul>
    </div>
  </aside>

  <section aria-label="Fremgangsmåde" style="display: flex; flex-direction: column; padding: 26px 40px 32px; gap: 22px; min-height: 0">
    <header style="display: flex; align-items: center; gap: 16px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 30px; font-weight: 700">Lasagne</h1>
      <span style="font-size: 14px; color: #A7AAB2; display: flex; align-items: center; gap: 8px; background: #15171B; padding: 8px 14px; border-radius: 999px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFC27A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Skærmen holdes tændt
      </span>
      <div style="flex: 1"></div>
      <a href="Main.dc.html" aria-label="Afslut kogetilstand" style="width: 48px; height: 48px; border-radius: 999px; background: #15171B; color: #F4F2EE; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </a>
    </header>

    <div role="progressbar" aria-label="Fremskridt" aria-valuemin="1" aria-valuemax="{{total}}" aria-valuenow="{{stepNumber}}" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{segments}}" as="seg" hint-placeholder-count="7">
        <span style="{{seg.style}}"></span>
      </sc-for>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; min-height: 0">
      <span style="font-size: 16px; font-weight: 600; color: #7CECFF; letter-spacing: 0.04em; text-transform: uppercase">Trin {{stepNumber}} af {{total}}</span>
      <p aria-live="polite" style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 46px; line-height: 1.18; font-weight: 500; letter-spacing: -0.01em; max-width: 780px">{{current}}</p>
      <sc-if value="{{hasTimer}}" hint-placeholder-val="{{ true }}">
        <button type="button" style="align-self: flex-start; height: 60px; padding: 0 26px 0 20px; border-radius: 999px; border: 0; background: rgba(255,194,122,0.14); color: #FFC27A; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 12px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
          Start timer · {{timer}}
        </button>
      </sc-if>
      <sc-if value="{{hasNext}}" hint-placeholder-val="{{ true }}">
        <p style="margin: 8px 0 0; font-size: 16px; color: #A7AAB2; max-width: 780px">Næste: {{next}}</p>
      </sc-if>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
      <button type="button" onClick="{{prev}}" disabled="{{isFirst}}" style="{{prevStyle}}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        Forrige
      </button>
      <button type="button" onClick="{{nextStep}}" style="height: 88px; border-radius: 24px; border: 0; background: #7CECFF; color: #061319; font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 12px">
        {{nextLabel}}
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 2 };
  }
  renderVals() {
    var steps = [
      { text: 'Tænd ovnen på 200 °C almindelig ovn.' },
      { text: 'Brun oksekødet med hakket løg og hvidløg i en stor gryde.' },
      { text: 'Tilsæt hakkede tomater og tomatpuré, og lad kødsaucen simre under låg.', timer: '15 min' },
      { text: 'Smelt smørret, pisk melet i, og rør mælken i lidt ad gangen. Smag til med muskat.' },
      { text: 'Læg lag af kødsauce, lasagneplader, spinat og hvid sauce i et ovnfast fad.' },
      { text: 'Drys med revet ost, og bag lasagnen midt i ovnen, til den er gylden.', timer: '35 min' },
      { text: 'Lad lasagnen hvile, før den skæres ud.', timer: '10 min' }
    ];
    var self = this;
    var i = this.state.step;
    var last = i === steps.length - 1;
    return {
      total: steps.length,
      stepNumber: i + 1,
      current: steps[i].text,
      hasTimer: !!steps[i].timer,
      timer: steps[i].timer || '',
      hasNext: !last,
      next: last ? '' : steps[i + 1].text,
      isFirst: i === 0,
      nextLabel: last ? 'Færdig – velbekomme' : 'Næste trin',
      prevStyle: 'height: 88px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.14); background: transparent; color: #F4F2EE; font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 12px;' + (i === 0 ? ' opacity: 0.4;' : ''),
      prev: function () { if (self.state.step > 0) self.setState({ step: self.state.step - 1 }); },
      nextStep: function () { if (self.state.step < steps.length - 1) self.setState({ step: self.state.step + 1 }); },
      segments: steps.map(function (_, k) {
        return { style: 'height: 6px; border-radius: 999px; background: ' + (k < i ? '#4FA9B8' : k === i ? '#7CECFF' : '#23262D') + ';' };
      }),
      ingredients: [
        { amount: '500 g', name: 'hakket oksekød' },
        { amount: '1', name: 'løg' },
        { amount: '2 fed', name: 'hvidløg' },
        { amount: '2 dåser', name: 'hakkede tomater' },
        { amount: '2 spsk', name: 'tomatpuré' },
        { amount: '9', name: 'lasagneplader' },
        { amount: '150 g', name: 'spinat' },
        { amount: '50 g', name: 'smør' },
        { amount: '4 spsk', name: 'hvedemel' },
        { amount: '6 dl', name: 'mælk' },
        { amount: '100 g', name: 'revet ost' },
        { amount: '', name: 'muskat, salt og peber' }
      ]
    };
  }
}
</script>
</body>
</html>
